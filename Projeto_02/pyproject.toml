[project]
name = "Projeto-02"
version = "0.1.0"
description = ""
authors = [{ name = "Thiago Souza"}]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.104.1,<0.105",
    "uvicorn>=0.24.0.post1,<0.25",
    "streamlit>=1.28.1,<2",
    "sqlalchemy>=2.0.23,<3",
    "plotly>=5.18.0,<6",
    "psycopg2-binary>=2.9.13",
    "email-validator>=2.3.0",
    "numpy>=2.0",
    "pyarrow>=14.0.1",
]

[dependency-groups]
docs = ["mkdocs>=1.5.3,<2"]
dev = [
    "pytest>=7.4.3,<8",
    "taskipy>=1.12.0,<2",
    "isort==5.12.0",
    "ruff==0.1.5",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["crud_fastapi_postgres_streamlit"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.taskipy.tasks]
lint = "ruff . & isort ."
kill = "kill -9 $(lsof -t -i:8000)"
run = "uvicorn backend.main:app --reload & streamlit run frontend/app.py"
